<!doctype html><html><head><meta charset="utf-8"><title>Eat Out final UI</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:#2A3950;color:#fff;padding:24px;width:1160px}
section{margin-bottom:30px} section>h1{font-size:19px;margin-bottom:14px}
.grid{display:flex;gap:26px;align-items:flex-start}
.opt{width:340px}.opt h2{font-size:15px;margin-bottom:4px}.opt p{font-size:12px;opacity:.75;margin-bottom:12px;min-height:34px}
.phone{width:340px;height:690px;border-radius:34px;overflow:hidden;border:8px solid #111;display:flex;flex-direction:column;color:#1C1C1E;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
/* log */
.log{background:linear-gradient(180deg,#A9F1FF 0%,#C9D3FE 100%)}
.bar{display:flex;align-items:center;gap:10px;padding:26px 16px 14px;background:#6F88FC;color:#fff}
.date{font-weight:700;font-size:17px}.arr{font-size:22px;opacity:.75}
.icons{margin-left:auto;display:flex;gap:8px}
.ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:rgba(255,255,255,.22);border-radius:50%}
.cols{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:12px 16px 6px;opacity:.6}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:15px;border-top:1px solid rgba(0,0,0,.1)}
.row .c{opacity:.55;font-size:13px}.row.ph{opacity:.4}
.row.active{background:#FFFFF0;border-radius:12px;margin:3px 8px;padding-left:8px;padding-right:8px;border-top-color:transparent}
.cur{display:inline-block;width:2px;height:17px;margin-left:1px;vertical-align:-3px;background:#6F88FC}
.tick{position:absolute;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;background:#A163F7}
.saved{position:absolute;right:84px;bottom:36px;font-size:13px;opacity:.6}
.wbox{position:absolute;left:18px;bottom:18px;height:54px;min-width:104px;border-radius:16px;background:#FFFFF0;padding:7px 14px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 3px 10px rgba(60,60,140,.15)}
.wbox .l{font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.55}.wbox .v{font-size:18px;font-weight:700;color:#1E8E45}.wbox .v.empty{color:#6F88FC;font-size:15px}
.kg{font-size:12px;opacity:.6;color:#1C1C1E;font-weight:600}
.keys{position:absolute;left:0;right:0;bottom:0;height:210px;background:#D1D5DB;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys div{background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
/* pink */
.pink{background:#FCF1F0}
.mtab{display:flex;align-items:center;padding:24px 14px 12px;background:linear-gradient(90deg,#F3A8BB,#F8BF80);color:#5A1530}.mtab .t{flex:1;text-align:center;font-weight:700;font-size:16px}
.calg{padding:6px 5px 8px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{text-align:center;font-size:9px;opacity:.6;padding:4px 0}
.cell{height:66px;border-radius:6px;padding:3px;font-size:8px;line-height:10px;overflow:hidden;background:#fff;border:1px solid #F3A8BB}
.cell.blank{background:transparent;border-color:transparent}.cell.today{background:#FBD9B4;border-color:#E08A3C}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px;white-space:nowrap;gap:2px}
.top b{font-size:9px;opacity:.7}.top .w{font-size:8.5px;font-weight:800;color:#1E8E45;flex-shrink:0;letter-spacing:-.2px}
.cell span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum{flex:1;background:#ED4D8B;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigt{font-size:20px;font-weight:700}
.stats{display:flex;gap:8px;margin-top:10px}.stat{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;text-align:center;min-width:64px}
.stat .n{font-size:16px;font-weight:700}.stat .l{font-size:10px;opacity:.85}
.chips{display:flex;gap:6px;justify-content:center;padding:12px 0 4px}
.chip{font-size:11px;font-weight:600;padding:5px 11px;border-radius:999px;background:#fff;color:#5A1530;border:1px solid #F3A8BB}.chip.on{background:#ED4D8B;color:#fff;border-color:#ED4D8B}
.hero{text-align:center;padding:6px 0 0}.hero .n{font-size:34px;font-weight:800}.hero .n small{font-size:15px;font-weight:600;opacity:.55}.hero .d{font-size:12px;font-weight:700;color:#1E8E45}
.card{margin:8px 10px 0;background:#fff;border-radius:14px;border:1px solid #F6D3DC;padding:6px 4px 4px}
.tip{position:absolute;background:#5A1530;color:#fff;font-size:10px;font-weight:600;padding:4px 7px;border-radius:7px;white-space:nowrap}
.leg{text-align:center;font-size:10px;color:#5A1530;opacity:.8;padding:2px 0}
</style></head><body><div id="root"></div>
<script>
const calIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8" cy="14" r=".6" fill="#fff"/><circle cx="12" cy="14" r=".6" fill="#fff"/><circle cx="16" cy="14" r=".6" fill="#fff"/></svg>`;
const graphIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-6"/></svg>`;
const bar=`<div class="bar"><span class="arr">‹</span><span class="date">Fri, 23 Oct 2026</span><span class="arr">›</span><div class="icons"><div class="ic">${calIcon}</div><div class="ic">${graphIcon}</div></div></div><div class="cols"><span>What I ate</span><span>Cost</span></div>`;
const r=(f,c,cls='')=>`<div class="row ${cls}"><span>${f}</span><span class="c">${c}</span></div>`;
const wb=(v)=>`<div class="wbox"><div class="l">Weight</div>${v?`<div class="v">${v} <span class="kg">kg</span></div>`:`<div class="v empty">+ Add</div>`}</div>`;
// Log 1: fresh open, cursor in first row
const log1=`<div class="phone log">${bar}${r('<span class="cur" style="margin-left:0"></span><span style="opacity:.4">Add food…</span>','<span>optional</span>','active')}${wb('')}<div class="tick">✓</div></div>`;
// Log 2: typing
const log2=`<div class="phone log">${bar}${r('Chicken biryani','320')}${r('Lassi','optional')}${r('Gulab jam<span class="cur"></span>','optional','active')}${wb('')}<div class="tick">✓</div></div>`;
// Log 3: weight input
const log3=`<div class="phone log">${bar}${r('Chicken biryani','320')}${r('Lassi','optional')}${r('Gulab jamun','optional')}${r('Add food…','optional','ph')}
 <div class="wbox" style="min-width:150px;border:2px solid #6F88FC;bottom:228px"><div class="l">Weight</div><div class="v">72.4<span class="cur" style="height:16px"></span> <span class="kg">kg</span></div></div>
 <div class="tick" style="bottom:228px">✓</div><div class="keys">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>`<div>${k}</div>`).join('')}</div></div>`;
// Log 4: saved
const log4=`<div class="phone log">${bar}${r('Chicken biryani','320')}${r('Lassi','optional')}${r('Gulab jamun','optional')}${r('Add food…','optional','ph')}${wb('72.4')}<div class="saved">Saved</div><div class="tick">✓</div></div>`;
// Calendar
const W={1:73.2,2:73.0,5:72.9,6:73.1,9:72.8,12:72.9,14:73.4,15:73.1,19:72.6,21:72.9,23:72.4};
const items={2:['Five Guys burger'],5:['Bubble tea','Momos'],11:['Masala dosa'],14:['Pizza','Garlic bread','Coke','+2 more'],19:['Ramen'],23:['Chicken biryani','Lassi','Gulab jamun']};
let cells=[null,null,null];for(let d=1;d<=31;d++)cells.push(d);while(cells.length%7)cells.push(null);
const cal=`<div class="phone pink"><div class="mtab"><span style="font-size:13px;font-weight:600">‹ Log</span><span class="t">‹ &nbsp;October 2026&nbsp; ›</span><span style="width:34px"></span></div>
 <div class="calg"><div class="wk">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd">${w}</div>`).join('')}</div><div class="wk">${cells.map(d=>!d?`<div class="cell blank"></div>`:
 `<div class="cell ${d===23?'today':''}"><div class="top"><b>${d}</b>${W[d]?`<span class="w">${W[d].toFixed(1)}</span>`:''}</div>${(items[d]||[]).map(x=>`<span style="${x.startsWith('+')?'opacity:.55':''}">${x}</span>`).join('')}</div>`).join('')}</div></div>
 <div class="sum"><div class="bigt">6 days eating out</div><div class="stats"><div class="stat"><div class="n">14</div><div class="l">items</div></div><div class="stat"><div class="n">2220</div><div class="l">spent</div></div></div></div></div>`;
// Graph G2
const ATE=[2,5,11,14,19,23];
function chart(w=294,h=200,tipDay=14){
  const L=30,R=10,T=14,B=34,pw=w-L-R,ph=h-T-B,min=72,max=74;
  const x=d=>L+(d-1)/30*pw, y=v=>T+(max-v)/(max-min)*ph;
  const pts=Object.entries(W).map(([d,v])=>[x(+d),y(v),+d,v]);
  let s=`<svg width="${w}" height="${h}" style="display:block">`;
  [72,72.5,73,73.5,74].forEach(v=>{s+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="#F6D3DC"/><text x="${L-5}" y="${y(v)+3}" font-size="8.5" text-anchor="end" fill="#8A6A74">${v.toFixed(1)}</text>`});
  [1,8,15,22,29].forEach(d=>{s+=`<text x="${x(d)}" y="${h-22}" font-size="8.5" text-anchor="middle" fill="#8A6A74">${d} Oct</text>`});
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  s+=`<path d="${path}" fill="none" stroke="#ED4D8B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const tp=pts.find(p=>p[2]===tipDay);
  s+=`<line x1="${tp[0]}" x2="${tp[0]}" y1="${T}" y2="${T+ph}" stroke="#5A1530" stroke-opacity=".25" stroke-dasharray="3 3"/>`;
  pts.forEach(p=>{const t=p[2]===tipDay;s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${t?5:3.5}" fill="${t?'#ED4D8B':'#fff'}" stroke="${t?'#fff':'#ED4D8B'}" stroke-width="2"/>`});
  ATE.forEach(d=>{s+=`<rect x="${x(d)-3}" y="${h-14}" width="6" height="6" rx="1.5" fill="#F8BF80" stroke="#E08A3C"/>`});
  return `<div style="position:relative">${s}</svg><div class="tip" style="left:${tp[0]-34}px;top:${tp[1]-30}px">14 Oct · 73.4 kg</div></div>`;
}
const graph=`<div class="phone pink"><div class="mtab"><span style="font-size:13px;font-weight:600">‹ Log</span><span class="t">Weight</span><span style="width:34px"></span></div>
 <div class="chips"><span class="chip on">1M</span><span class="chip">3M</span><span class="chip">6M</span><span class="chip">1Y</span><span class="chip">All</span></div>
 <div class="hero"><div class="n">72.4 <small>kg</small></div><div class="d">▼ 0.8 kg since 1 Oct</div></div>
 <div class="card">${chart()}<div class="leg"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#F8BF80;border:1px solid #E08A3C;vertical-align:-1px"></span> day you ate out</div></div>
 <div class="sum" style="margin-top:10px"><div style="font-size:13px;font-weight:600;margin-bottom:10px;padding:0 22px;text-align:center">Weight was 0.2 kg higher, on average, the day after eating out</div>
 <div class="stats"><div class="stat"><div class="n">72.4</div><div class="l">lowest</div></div><div class="stat"><div class="n">73.4</div><div class="l">highest</div></div><div class="stat"><div class="n">72.9</div><div class="l">average</div></div></div></div></div>`;
const sec=(t,cards)=>`<section><h1>${t}</h1><div class="grid">${cards.map(([h,p,ph])=>`<div class="opt"><h2>${h}</h2><p>${p}</p>${ph}</div>`).join('')}</div></section>`;
document.getElementById('root').innerHTML=
 sec('Screen 1 · Log',[
  ['1. Open the app','Today’s date is filled in and the cursor waits in the first row.',log1],
  ['2. Typing food','The row you’re typing in turns cream. Press Enter for the next line.',log2],
  ['3. Entering weight','Tap the weight box and type, using the number keyboard.',log3]])+
 sec('Screen 1 · after saving, and the other two screens',[
  ['4. Saved','Tap ✓ and you’re done. The weight shows in green.',log4],
  ['5. Calendar (calendar icon)','Foods on each day, weight in green at the top-right, and the month summary below.',cal],
  ['6. Weight graph (graph icon)','Weight over time, with eating-out days marked. Tap a dot for that day’s weight.',graph]]);
</script></body></html>
