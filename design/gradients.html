<!doctype html><html><head><meta charset="utf-8"><title>Header gradients</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:#2A3950;color:#fff;padding:24px;width:1160px}
section{margin-bottom:30px} section>h1{font-size:19px;margin-bottom:4px} section>.sub{font-size:13px;opacity:.75;margin-bottom:16px;max-width:1040px}
.grid{display:flex;gap:26px;align-items:flex-start}
.opt{width:340px}.opt h2{font-size:15px;margin-bottom:4px}.opt p{font-size:12px;opacity:.75;margin-bottom:12px;min-height:34px}
.phone{width:340px;height:560px;border-radius:34px;overflow:hidden;border:8px solid #111;display:flex;flex-direction:column;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:8px;padding:26px 14px 12px}
.date{font-weight:700;font-size:16px}.arr{font-size:20px;opacity:.8}
.icons{margin-left:auto;display:flex;gap:7px}
.ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%}
.tabs{display:flex;gap:3px;margin:0 14px 12px;border-radius:12px;padding:3px}
.tab{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:7px 0;border-radius:9px}
.tab.on{background:#fff}
/* food */
.cols{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:14px 16px 6px;opacity:.6}
.frow{display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;border-top:1px solid rgba(90,21,48,.1)}.frow .c{opacity:.55;font-size:13px}
.frow.active{background:#FBD9B4;border-radius:12px;margin:3px 8px;padding-left:8px;padding-right:8px;border-top-color:transparent}
/* habits */
.prog{margin:12px 16px 6px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}
.pbar{flex:1;height:8px;border-radius:4px;background:rgba(16,47,21,.12);overflow:hidden}.pbar b{display:block;height:100%;width:66%;background:#728C5A;border-radius:4px}
.hrow{display:flex;align-items:center;gap:12px;margin:4px 12px;padding:10px 12px;border-radius:14px;background:#fff;font-size:14px;font-weight:600}
.hrow .chk{width:26px;height:26px;border-radius:50%;border:2px solid #728C5A;display:flex;align-items:center;justify-content:center;font-size:13px;color:#EAF1B1;font-weight:800;margin-left:auto}
.hrow.done{background:#102F15;color:#EAF1B1}.hrow.done .chk{background:#728C5A;border-color:#728C5A}
/* workout */
.wcols{display:grid;grid-template-columns:1fr 46px 58px 46px;gap:6px;font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:14px 16px 6px;font-weight:700;color:rgba(0,29,79,.55)}
.wcols span:not(:first-child){text-align:center}
.trow{display:grid;grid-template-columns:1fr 46px 58px 46px;gap:6px;align-items:center;padding:10px 16px;font-size:14.5px;border-top:1px solid rgba(0,29,79,.1)}
.trow span:not(:first-child){text-align:center;font-weight:600}
.trow.cont{border-top:none;padding-top:2px}
.trow.cont span:first-child{color:rgba(0,29,79,.35);font-size:12px;padding-left:12px}
.trow.active{background:#fff;margin:3px 8px;padding:10px 8px;border-radius:12px;border:1.5px solid #17C2FF}
.cur{display:inline-block;width:2px;height:16px;margin-left:1px;vertical-align:-3px;background:#0A6CF2}
.note{position:absolute;left:12px;right:12px;bottom:14px;font-size:11px;line-height:1.4;background:rgba(255,255,255,.85);border-radius:12px;padding:8px 10px;color:#001D4F}
</style></head><body><div id="root"></div>
<script>
const calIcon=c=>`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>`;
const graphIcon=c=>`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-6"/></svg>`;
const statsIcon=c=>`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V13M10 20V7M15 20v-9M20 20V4"/></svg>`;
const wcalIcon=c=>`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M9 14.5l2 2 4-4"/></svg>`;
// t: grad, ink, icBg, track, tabOff, onInk
const header=(t,icons,active)=>`<div style="background:${t.grad}"><div class="bar" style="color:${t.ink}"><span class="arr">‹</span><span class="date">Fri, 23 Oct</span><span class="arr">›</span><div class="icons">${icons.map(f=>`<div class="ic" style="background:${t.icBg}">${f(t.icInk||t.ink)}</div>`).join('')}</div></div>
 <div class="tabs" style="background:${t.track}">${['Food','Habits','Workout'].map(n=>`<span class="tab ${n===active?'on':''}" style="color:${n===active?t.onInk:t.tabOff}">${n}${n==='Habits'?' <span style="opacity:.65;font-size:11px">6/9</span>':''}</span>`).join('')}</div></div>`;
const foodBody=`<div class="cols"><span>What I ate</span><span>Cost</span></div><div class="frow"><span>Chicken biryani</span><span class="c">320</span></div><div class="frow"><span>Lassi</span><span class="c">optional</span></div><div class="frow active"><span>Gulab jam<span class="cur" style="background:#ED4D8B"></span></span><span class="c">optional</span></div>`;
const habBody=`<div class="prog"><span>6 of 9 today</span><div class="pbar"><b></b></div><span style="background:#102F15;color:#EAF1B1;padding:6px 11px;border-radius:999px;font-size:11px">✎ Edit</span></div>
 ${[['Sleep from 12 to 8',1],['Morning manifest',1],['Reading for 30 mins',0],['Healthy diet',1],['Goal journaling',0],['Vitamins',1]].map(([n,d])=>`<div class="hrow ${d?'done':''}"><span>${n}</span><span class="chk">${d?'✓':''}</span></div>`).join('')}`;
const wBody=`<div class="wcols"><span>Exercise</span><span>Sets</span><span>kg</span><span>Reps</span></div>
 <div class="trow"><span>Bench press</span><span>4</span><span>60</span><span>8</span></div>
 <div class="trow cont"><span>↳ same exercise</span><span>2</span><span>65</span><span>6</span></div>
 <div class="trow"><span>Incline DB press</span><span>3</span><span>22.5</span><span>10</span></div>
 <div class="trow"><span>Cable fly</span><span>3</span><span>15</span><span>12</span></div>
 <div class="trow cont"><span>↳ same exercise</span><span>1</span><span>12.5</span><span>15</span></div>
 <div class="trow active"><span style="color:rgba(0,29,79,.35);font-size:12px;padding-left:12px"><span class="cur" style="margin-left:0"></span> leave empty for another set</span><span>2</span><span>–</span><span>–</span></div>
 <div class="note"><b>Different weight?</b> Add a row without a name, and it counts as more sets of the exercise above. The calendar and the Workout habit still count it as one workout.</div>`;
const phone=(bg,ink,h,b)=>`<div class="phone" style="background:${bg};color:${ink}">${h}${b}</div>`;
const food=phone('#FCF1F0','#3A0F20',header({grad:'linear-gradient(90deg,#F3A8BB,#F8BF80)',ink:'#5A1530',icBg:'rgba(255,255,255,.45)',track:'rgba(255,255,255,.35)',tabOff:'#5A1530',onInk:'#ED4D8B'},[calIcon,graphIcon],'Food'),foodBody);
const habs=[
 ['G1: Forest → sage','Dark to mid green with white text. It’s the closest to today’s solid bar, with a little more depth.',{grad:'linear-gradient(90deg,#102F15,#728C5A)',ink:'#fff',icBg:'rgba(255,255,255,.2)',track:'rgba(255,255,255,.16)',tabOff:'rgba(255,255,255,.88)',onInk:'#102F15'}],
 ['G2: Sage → pale lime','Mid green to lime with dark-forest text. It’s a soft pastel gradient, the closest match to the pink-to-peach bar on Food.',{grad:'linear-gradient(90deg,#728C5A,#EAF1B1)',ink:'#102F15',icBg:'rgba(255,255,255,.4)',track:'rgba(255,255,255,.32)',tabOff:'#102F15',onInk:'#102F15'}],
 ['G3: Forest → sage → lime','Three steps from dark to light. Bold on the left where the date is, and light on the right.',{grad:'linear-gradient(90deg,#102F15 0%,#728C5A 60%,#EAF1B1 100%)',ink:'#fff',icInk:'#102F15',icBg:'rgba(255,255,255,.55)',track:'rgba(255,255,255,.2)',tabOff:'rgba(255,255,255,.9)',onInk:'#102F15'}],
];
const wos=[
 ['B1: Navy → blue','Dark navy to bright blue with white text. Strong and sporty.',{grad:'linear-gradient(90deg,#001D4F,#0A6CF2)',ink:'#fff',icBg:'rgba(255,255,255,.2)',track:'rgba(255,255,255,.16)',tabOff:'rgba(255,255,255,.88)',onInk:'#0A6CF2'}],
 ['B2: Blue → cyan','Bright blue to cyan with white text. Lighter and more energetic than B1.',{grad:'linear-gradient(90deg,#0A6CF2,#17C2FF)',ink:'#fff',icBg:'rgba(0,29,79,.25)',track:'rgba(0,29,79,.22)',tabOff:'#fff',onInk:'#0A6CF2'}],
 ['B3: Cyan → pale blue + amber line','Cyan to pale blue with navy text, plus a thin amber line under the bar for a pop of the accent colour.',{grad:'linear-gradient(90deg,#17C2FF,#DDF5FF)',ink:'#001D4F',icBg:'rgba(255,255,255,.5)',track:'rgba(255,255,255,.4)',tabOff:'#001D4F',onInk:'#0A6CF2',amber:true}],
];
const sec=(t,s,cards)=>`<section><h1>${t}</h1><div class="sub">${s}</div><div class="grid">${cards.map(([h,p,ph])=>`<div class="opt"><h2>${h}</h2><p>${p}</p>${ph}</div>`).join('')}</div></section>`;
document.getElementById('root').innerHTML=
 sec('Food (final): pink-to-peach bar','The rest of the screen stays as P2: a peach active row and a pink ✓.',[['Food tab','',food]])+
 sec('Habits: top bar gradient (pick one)','The same gradient would also be used on the Edit habits and habit dashboard screens.',habs.map(([h,p,t])=>[h,p,phone('#EBFADC','#102F15',header(t,[statsIcon],'Habits'),habBody)]))+
 sec('Workout: top bar gradient (pick one)','This also shows your extra-set rows: no exercise name, just sets, kg and reps. The same gradient would be used on the workout calendar.',wos.map(([h,p,t])=>[h,p,phone('#DDF5FF','#001D4F',header(t,[wcalIcon],'Workout')+(t.amber?'<div style="height:3px;background:#FFB703"></div>':''),wBody)]));
</script></body></html>
