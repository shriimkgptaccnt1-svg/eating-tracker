<!doctype html><html><head><meta charset="utf-8"><title>Habits page mockups</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:#2A3950;color:#fff;padding:24px;width:1160px}
section{margin-bottom:30px} section>h1{font-size:19px;margin-bottom:4px} section>.sub{font-size:13px;opacity:.75;margin-bottom:16px;max-width:1000px}
.grid{display:flex;gap:26px;align-items:flex-start}
.opt{width:340px}.opt h2{font-size:15px;margin-bottom:4px}.opt p{font-size:12px;opacity:.75;margin-bottom:12px;min-height:48px}
.phone{width:340px;height:690px;border-radius:34px;overflow:hidden;border:8px solid #111;display:flex;flex-direction:column;color:#102F15;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:10px;padding:26px 16px 12px;color:#fff}
.date{font-weight:700;font-size:17px}.arr{font-size:22px;opacity:.75}
.icons{margin-left:auto;display:flex;gap:8px}
.ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:rgba(255,255,255,.22);border-radius:50%}
.tabs{display:flex;gap:4px;margin:0 16px 12px;background:rgba(255,255,255,.18);border-radius:12px;padding:3px}
.tab{flex:1;text-align:center;font-size:13px;font-weight:700;padding:7px 0;border-radius:9px;color:rgba(255,255,255,.85)}
.tab.on{background:#fff}
.tab .cnt{font-size:11px;font-weight:600;opacity:.7;margin-left:3px}
.dots{display:flex;gap:5px;justify-content:center;position:absolute;bottom:8px;left:0;right:0}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.2)}.dots i.on{background:rgba(0,0,0,.55)}
/* food */
.food{background:linear-gradient(180deg,#A9F1FF 0%,#C9D3FE 100%);color:#1C1C1E}
.cols{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:12px 16px 6px;opacity:.6}
.frow{display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;border-top:1px solid rgba(0,0,0,.1)}.frow .c{opacity:.55;font-size:13px}.frow.ph{opacity:.4}
.tick{position:absolute;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;background:#A163F7}
.wbox{position:absolute;left:18px;bottom:22px;height:54px;min-width:104px;border-radius:16px;background:#FFFFF0;padding:7px 14px;display:flex;flex-direction:column;justify-content:center}
.wbox .l{font-size:10px;text-transform:uppercase;letter-spacing:.6px;opacity:.55}.wbox .v{font-size:18px;font-weight:700;color:#1E8E45}
/* habits */
.hab{background:#EBFADC}
.prog{margin:12px 16px 6px;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}
.pbar{flex:1;height:8px;border-radius:4px;background:rgba(16,47,21,.12);overflow:hidden}.pbar b{display:block;height:100%;background:#728C5A;border-radius:4px}
.sec{font-size:10px;letter-spacing:.6px;text-transform:uppercase;opacity:.55;padding:10px 16px 4px;font-weight:600}
.hrow{display:flex;align-items:center;gap:12px;margin:4px 12px;padding:10px 12px;border-radius:14px;background:#fff;font-size:14px;font-weight:600}
.hrow .chk{width:26px;height:26px;border-radius:50%;border:2px solid #728C5A;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#EAF1B1;font-weight:800}
.hrow.done{background:#102F15;color:#EAF1B1}.hrow.done .chk{background:#728C5A;border-color:#728C5A}
.hrow.met{background:#EAF1B1}
.hrow .meta{margin-left:auto;font-size:11px;font-weight:600;opacity:.65;white-space:nowrap}
.hrow.done .meta{opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px}
.tile{aspect-ratio:1/1.05;border-radius:16px;background:#fff;padding:10px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;font-weight:700;line-height:1.25}
.tile .tm{font-size:10px;font-weight:600;opacity:.65}
.tile .tc{width:22px;height:22px;border-radius:50%;border:2px solid #728C5A;display:flex;align-items:center;justify-content:center;font-size:12px}
.tile.done{background:#102F15;color:#EAF1B1}.tile.done .tc{background:#728C5A;border-color:#728C5A;color:#EAF1B1}
.tile.met{background:#EAF1B1}
.wrow{margin:4px 12px;padding:9px 12px;border-radius:14px;background:#fff}
.wrow .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.wrow .top .meta{font-size:11px;opacity:.65}
.week{display:flex;gap:5px;margin-top:7px}
.week span{flex:1;text-align:center;font-size:9px;font-weight:700;padding:4px 0;border-radius:6px;background:rgba(16,47,21,.07);color:rgba(16,47,21,.45)}
.week span.d{background:#728C5A;color:#fff}.week span.t{outline:2px solid #102F15;outline-offset:-2px;color:#102F15}.week span.t.d{background:#102F15;color:#EAF1B1}
.week span.f{opacity:.45}
.editbtn{position:absolute;right:16px;bottom:22px;background:#102F15;color:#EAF1B1;font-size:13px;font-weight:700;padding:11px 16px;border-radius:999px}
/* edit */
.ehead{display:flex;align-items:center;padding:26px 16px 14px;background:#102F15;color:#EAF1B1}.ehead .t{flex:1;text-align:center;font-weight:700;font-size:16px}
.erow{display:flex;align-items:center;gap:10px;margin:4px 12px;padding:10px 12px;border-radius:14px;background:#fff;font-size:14px;font-weight:600}
.grip{opacity:.35;font-size:14px;letter-spacing:-2px}
.tgt{margin-left:auto;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:#EAF1B1;color:#102F15;white-space:nowrap}
.del{width:22px;height:22px;border-radius:50%;background:#C7432F;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.add{margin:10px 12px;padding:12px;border-radius:14px;border:2px dashed #728C5A;text-align:center;font-weight:700;font-size:14px;color:#728C5A}
.dim{position:absolute;inset:0;background:rgba(16,47,21,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#EBFADC;border-radius:22px 22px 0 0;padding:16px 18px 22px}
.grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.18);margin:0 auto 12px}
.field{background:#fff;border-radius:12px;padding:12px;font-size:15px;font-weight:600;border:2px solid #728C5A}
.lab{font-size:11px;font-weight:700;opacity:.6;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.seg{display:flex;gap:6px}.seg span{flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#fff;font-size:13px;font-weight:700}
.seg span.on{background:#102F15;color:#EAF1B1}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px;font-size:14px;font-weight:700}
.stepper .pm{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;color:#728C5A}
.stepper .n{font-size:30px;font-weight:800}
.btn{margin-top:16px;background:#102F15;color:#EAF1B1;border-radius:14px;text-align:center;padding:13px;font-weight:700;font-size:15px}
.swipe{display:flex;margin:4px 12px;border-radius:14px;overflow:hidden}
.swipe .front{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;font-size:14px;font-weight:600;transform:translateX(0)}
.swipe .back{width:84px;background:#C7432F;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.dialog{position:absolute;left:24px;right:24px;top:240px;background:#fff;border-radius:18px;padding:18px;color:#102F15}
.dialog h3{font-size:16px;margin-bottom:6px}.dialog p{font-size:12px;opacity:.7;line-height:1.4}
.dbtns{display:flex;gap:8px;margin-top:14px}.dbtns span{flex:1;text-align:center;padding:10px;border-radius:12px;font-weight:700;font-size:13px;background:#EBFADC}.dbtns span.red{background:#C7432F;color:#fff}
</style></head><body><div id="root"></div>
<script>
const calIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>`;
const graphIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-6"/></svg>`;
const statsIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V13M10 20V7M15 20v-9M20 20V4"/></svg>`;
const bar=(bg,active)=>`<div style="background:${bg}"><div class="bar"><span class="arr">‹</span><span class="date">Fri, 23 Oct</span><span class="arr">›</span><div class="icons">${active==='hab'?`<div class="ic">${statsIcon}</div>`:`<div class="ic">${calIcon}</div><div class="ic">${graphIcon}</div>`}</div></div>
 <div class="tabs"><span class="tab ${active==='food'?'on':''}" style="${active==='food'?'color:#6F88FC':''}">Food</span><span class="tab ${active==='hab'?'on':''}" style="${active==='hab'?'color:#102F15':''}">Habits<span class="cnt">6/9</span></span><span class="tab">Workout</span></div></div>`;
const dots=(i)=>`<div class="dots"><i class="${i===0?'on':''}"></i><i class="${i===1?'on':''}"></i><i></i></div>`;
// Fri 23 Oct, week Mon 19 - Sun 25
const H=[
 {n:'Sleep from 12 to 8',t:7,done:true,wk:[1,1,0,1,1]},
 {n:'Morning manifest',t:7,done:true,wk:[1,1,1,1,1]},
 {n:'Workout',t:5,done:true,wk:[1,0,1,0,1],c:3},
 {n:'Reading for 30 mins',t:7,done:false,wk:[1,1,0,1,0]},
 {n:'Talk to fam & friends',t:5,done:false,wk:[1,1,1,1,0],c:4},
 {n:'Healthy diet',t:7,done:true,wk:[0,1,1,0,1]},
 {n:'Goal journaling',t:7,done:false,wk:[1,0,1,0,0]},
 {n:'Vitamins',t:7,done:true,wk:[1,1,1,1,1]},
 {n:'Pursue hobbies',t:1,done:false,wk:[0,1,0,0,0],c:1,met:true},
];
const tgt=h=>h.t===7?'Every day':`${h.t}× a week`;
const meta=h=>h.t===7?'':(h.met?'done this week ✓':`${h.c}/${h.t} this week`);
const food=`<div class="phone food">${bar('#6F88FC','food')}<div class="cols"><span>What I ate</span><span>Cost</span></div>
 <div class="frow"><span>Chicken biryani</span><span class="c">320</span></div><div class="frow"><span>Lassi</span><span class="c">optional</span></div><div class="frow ph"><span>Add food…</span><span class="c">optional</span></div>
 <div class="wbox"><div class="l">Weight</div><div class="v">72.4 <span style="font-size:12px;opacity:.6;color:#1C1C1E;font-weight:600">kg</span></div></div><div class="tick">✓</div>${dots(0)}</div>`;
const progress=`<div class="prog"><span>6 of 9 today</span><div class="pbar"><b style="width:66%"></b></div><span style="background:#102F15;color:#EAF1B1;padding:6px 11px;border-radius:999px;font-size:11px">✎ Edit</span></div>`;
// H1 checklist
const h1rows=(list)=>list.map(h=>`<div class="hrow ${h.done?'done':''} ${!h.done&&h.met?'met':''}"><span>${h.n}</span><span class="meta">${meta(h)}</span><span class="chk" style="${meta(h)?'':'margin-left:auto'}">${h.done?'✓':''}</span></div>`).join('');
const H1=`<div class="phone hab">${bar('#102F15','hab')}${progress}
 <div class="sec">Daily</div>${h1rows(H.filter(h=>h.t===7))}<div class="sec">Weekly</div>${h1rows(H.filter(h=>h.t!==7))}${dots(1)}</div>`;
// H2 tiles
const H2=`<div class="phone hab">${bar('#102F15','hab')}${progress}<div class="tiles">${H.map(h=>`<div class="tile ${h.done?'done':''} ${!h.done&&h.met?'met':''}"><span class="tc">${h.done?'✓':''}</span><span>${h.n}</span><span class="tm">${h.t===7?'daily':meta(h)}</span></div>`).join('')}</div>${dots(1)}</div>`;
// H3 rows with this week's days
const days=['M','T','W','T','F','S','S'];
const H3=`<div class="phone hab">${bar('#102F15','hab')}<div style="overflow:hidden;flex:1">${H.slice(0,7).map(h=>`<div class="wrow"><div class="top"><span>${h.n}</span><span class="meta">${h.t===7?`${h.wk.filter(Boolean).length}/5 so far`:meta(h)}</span></div>
 <div class="week">${days.map((d,i)=>`<span class="${i<5&&h.wk[i]?'d':''} ${i===4?'t':''} ${i>4?'f':''}">${d}</span>`).join('')}</div></div>`).join('')}</div>${dots(1)}</div>`;
// Edit screen
const edit=`<div class="phone hab"><div class="ehead"><span style="font-size:13px;font-weight:600">‹ Back</span><span class="t">Edit habits</span><span style="font-size:13px;font-weight:700">Done</span></div>
 <div style="font-size:11px;opacity:.6;padding:10px 16px 2px">Drag ≡ to reorder · tap a habit to rename it or change its target</div>
 ${H.map(h=>`<div class="erow"><span class="del">−</span><span>${h.n}</span><span class="tgt">${tgt(h)}</span><span class="grip">≡</span></div>`).join('')}
 <div class="add">+ Add habit</div></div>`;
// Add sheet
const addSheet=`<div class="phone hab"><div class="ehead"><span style="font-size:13px;font-weight:600">‹ Back</span><span class="t">Edit habits</span><span style="font-size:13px;font-weight:700">Done</span></div>
 ${H.slice(0,6).map(h=>`<div class="erow"><span class="del">−</span><span>${h.n}</span><span class="tgt">${tgt(h)}</span><span class="grip">≡</span></div>`).join('')}
 <div class="dim"></div><div class="sheet"><div class="grab"></div><div style="font-weight:800;font-size:16px;text-align:center;margin-bottom:12px">New habit</div>
 <div class="field">Drink 3L water<span style="border-right:2px solid #102F15;margin-left:1px"></span></div>
 <div class="lab">How often</div><div class="seg"><span>Every day</span><span class="on">Days a week</span></div>
 <div class="stepper"><span class="pm">−</span><span class="n">4</span><span class="pm">+</span><span style="opacity:.6">days a week</span></div>
 <div class="btn">Add habit</div></div></div>`;
// Delete confirm
const delC=`<div class="phone hab"><div class="ehead"><span style="font-size:13px;font-weight:600">‹ Back</span><span class="t">Edit habits</span><span style="font-size:13px;font-weight:700">Done</span></div>
 ${H.map(h=>`<div class="erow"><span class="del">−</span><span>${h.n}</span><span class="tgt">${tgt(h)}</span><span class="grip">≡</span></div>`).join('')}
 <div class="dim"></div><div class="dialog"><h3>Delete “Vitamins”?</h3><p>It disappears from your daily list. Your past ticks are kept, so old months still show it.</p><div class="dbtns"><span>Cancel</span><span class="red">Delete</span></div></div></div>`;
const sec=(t,s,cards)=>`<section><h1>${t}</h1><div class="sub">${s}</div><div class="grid">${cards.map(([h,p,ph])=>`<div class="opt"><h2>${h}</h2><p>${p}</p>${ph}</div>`).join('')}</div></section>`;
document.getElementById('root').innerHTML=
 sec('1 · Swipe from Food to Habits','The app opens on Food. Swipe left (or tap “Habits”) to reach the habit list. Both tabs share the date bar, and the bar turns dark forest on the Habits tab. The tab shows today’s count (6/9).',
  [['Food tab (opens here)','The same final design as before, plus the Food | Habits switch under the date.',food],
   ['Habits tab: H1 checklist','Tap a row to tick it, and it saves straight away. Done rows turn dark forest. Weekly habits show their count, and turn pale lime once that week’s target is met.',H1]])+
 sec('2 · Habit list styles (pick one)','The same data shown three ways. Today is Friday 23 Oct, and the week runs Mon–Sun.',
  [['H1: Checklist','Daily and weekly habits in two groups. It’s the easiest to scan.',H1],
   ['H2: Tiles','A 3×3 grid of big tiles for your 9 habits. You can see everything without scrolling, and each tile is an easy tap target.',H2],
   ['H3: Rows with this week','Each habit shows Mon–Sun, so your week is visible as you tick. Today has a dark outline. It scrolls with 9 habits.',H3]])+
 sec('3 · Add, delete, reorder','Opened from the “✎ Edit” button next to today’s progress.',
  [['Edit list','Tap − to delete, drag ≡ to reorder, and tap a habit to rename it or change its target. “+ Add habit” is at the bottom.',edit],
   ['Add a habit','Type a name, then pick “Every day” or “Days a week” and set the number with − / +. The same panel opens when you edit an existing habit.',addSheet],
   ['Delete confirmation','A quick check so you don’t delete by accident. Past ticks are kept.',delC]]);
</script></body></html>
