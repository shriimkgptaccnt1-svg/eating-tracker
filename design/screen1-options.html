<!doctype html><html><head><meta charset="utf-8"><title>Log screen options</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:#2A3950;color:#fff;padding:24px;width:1340px}
.grid{display:flex;gap:26px}
.opt{width:300px}.opt h2{font-size:16px;margin-bottom:4px}.opt p{font-size:12px;opacity:.75;margin-bottom:12px;height:64px}
.phone{width:300px;height:620px;border-radius:34px;overflow:hidden;border:8px solid #111;display:flex;flex-direction:column;color:#1C1C1E;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:10px;padding:24px 16px 14px}
.date{font-weight:700;font-size:17px}.arr{font-size:22px;opacity:.7}.link{margin-left:auto;font-weight:600;font-size:13px}
.cols{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:12px 16px 6px;opacity:.6}
.rows{padding:0 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:15px;border-top:1px solid rgba(0,0,0,.1)}
.row .c{opacity:.55;font-size:13px}.row.ph{opacity:.4}
.cur{display:inline-block;width:2px;height:17px;margin-left:1px;vertical-align:-3px}
.tick{position:absolute;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700}
</style></head><body>
<div class="grid" id="root"></div>
<script>
const P={purple:'#A163F7',blue:'#6F88FC',cyan:'#45E3FF',cream:'#FFFFF0'};
const opts=[
 {name:'1: Purple bar + white card',desc:'Solid purple date bar with white text. The row you are typing in lifts into a white card with a purple edge on the left.',
  bg:'#9DEEFF',bar:P.purple,barInk:'#fff',link:'#fff',tick:P.purple,cur:P.purple,
  active:'background:#fff;border-left:4px solid #A163F7;border-radius:10px;margin:4px 10px;border-top:none;box-shadow:0 3px 10px rgba(80,40,160,.18);padding-left:12px'},
 {name:'2: Periwinkle bar + cream row',desc:'Periwinkle date bar with white text over the cyan-to-periwinkle fade. The active row fills with the cream from your palette.',
  bg:'linear-gradient(180deg,#A9F1FF 0%,#C9D3FE 100%)',bar:P.blue,barInk:'#fff',link:'#fff',tick:P.purple,cur:P.blue,
  active:'background:#FFFFF0;border-radius:12px;margin:4px 10px;border-top:none;padding-left:14px'},
 {name:'3: Purple-to-blue gradient bar',desc:'The date bar fades from purple to periwinkle, a match for the calendar’s pink-to-peach fade. The active row turns soft lavender with a purple underline.',
  bg:'#9DEEFF',bar:'linear-gradient(90deg,#A163F7,#6F88FC)',barInk:'#fff',link:'#fff',tick:P.purple,cur:P.purple,
  active:'background:#E6D9FD;border-bottom:2px solid #A163F7'},
 {name:'4: Cream bar + bright cyan row',desc:'Cream date bar with purple text on a pale cyan screen. The active row glows in the full bright cyan with a purple dot beside it.',
  bg:'#C2F5FF',bar:P.cream,barInk:'#5B2DB0',link:P.purple,tick:P.purple,cur:'#5B2DB0',dot:true,
  active:'background:#45E3FF'},
];
const rows=[['Chicken biryani','320'],['Lassi','optional'],['Gulab jam','optional']];
document.getElementById('root').innerHTML=opts.map(o=>`<div class="opt"><h2>${o.name}</h2><p>${o.desc}</p>
<div class="phone" style="background:${o.bg}">
 <div class="bar" style="background:${o.bar};color:${o.barInk}"><span class="arr">‹</span><span class="date">Fri, 23 Oct 2026</span><span class="arr">›</span><span class="link" style="color:${o.link}">Calendar</span></div>
 <div class="cols"><span>What I ate</span><span>Cost</span></div>
 ${rows.map(([f,c],i)=>{const a=i===2;return `<div class="row" style="${a?o.active:''}"><span>${a&&o.dot?'<span style="color:#A163F7">● </span>':''}${f}${a?`<span class="cur" style="background:${o.cur}"></span>`:''}</span><span class="c">${c}</span></div>`}).join('')}
 <div class="row ph"><span>Add food…</span><span class="c">optional</span></div>
 <div class="tick" style="background:${o.tick}">✓</div></div></div>`).join('');
</script></body></html>
