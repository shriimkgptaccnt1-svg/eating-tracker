<!doctype html><html><head><meta charset="utf-8"><title>Eat Out final screens</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,system-ui,sans-serif;background:#2A3950;color:#fff;padding:28px;width:1480px}
section{margin-bottom:34px}
h1{font-size:22px;margin-bottom:4px;display:flex;align-items:center;gap:10px}
h1 i{display:inline-block;width:16px;height:16px;border-radius:4px}
.sub{font-size:13px;opacity:.75;margin-bottom:16px}
.row{display:flex;gap:24px}
figure{width:338px}
figure img{width:338px;display:block}
figcaption{font-size:13px;font-weight:600;margin-top:10px}
figcaption span{display:block;font-weight:400;opacity:.7;font-size:12px;margin-top:2px}
</style></head><body>
<section><h1><i style="background:#ED4D8B"></i>Food &amp; weight (pink)</h1><div class="sub">Tab 1 of 3. The app opens here.</div><div class="row">
<figure><img src="final/01-food-open.png"><figcaption>1. Open the app<span>Today’s date, cursor ready. Icons: calendar and weight graph.</span></figcaption></figure>
<figure><img src="final/02-food-typing.png"><figcaption>2. Typing food<span>The row you’re typing in turns peach. Enter goes to the next line.</span></figcaption></figure>
<figure><img src="final/03-food-weight.png"><figcaption>3. Entering weight<span>Tap the box and type, using the number keyboard.</span></figcaption></figure>
<figure><img src="final/04-food-saved.png"><figcaption>4. Saved<span>Tap ✓ and you’re done.</span></figcaption></figure>
</div></section>
<section><h1><i style="background:#F8BF80"></i>Food &amp; weight: dashboards</h1><div class="sub">Opened from the two icons on the Food tab.</div><div class="row">
<figure><img src="final/05-calendar.png"><figcaption>5. Food calendar<span>Foods on each day, weight in green, and the month summary.</span></figcaption></figure>
<figure><img src="final/06-weight-graph.png"><figcaption>6. Weight graph<span>Weight over time, with eating-out days marked.</span></figcaption></figure>
</div></section>
<section><h1><i style="background:#728C5A"></i>Habits (green)</h1><div class="sub">Tab 2 of 3: swipe left from Food. The stats icon only appears on this tab.</div><div class="row">
<figure><img src="final/07-habits.png"><figcaption>7. Habits<span>Tap to tick; it saves straight away. Weekly habits show their count.</span></figcaption></figure>
<figure><img src="final/08-edit-habits.png"><figcaption>8. Edit habits<span>Delete (−), reorder (≡), or tap to rename or change the target.</span></figcaption></figure>
<figure><img src="final/09-add-habit.png"><figcaption>9. Add a habit<span>A name plus “Every day” or “N days a week”.</span></figcaption></figure>
<figure><img src="final/10-habit-dashboard.png"><figcaption>10. Habit dashboard<span>Week strips per habit, and the month score.</span></figcaption></figure>
</div></section>
<section><h1><i style="background:#0A6CF2"></i>Workout (blue)</h1><div class="sub">Tab 3 of 3: swipe left from Habits.</div><div class="row">
<figure><img src="final/11-workout.png"><figcaption>11. Workout<span>Exercise | Sets | kg | Reps. Enter moves to the next cell.</span></figcaption></figure>
<figure><img src="final/12-workout-calendar.png"><figcaption>12. Workout calendar<span>Amber = worked out. Tap a day to open it.</span></figcaption></figure>
</div></section>
</body></html>
